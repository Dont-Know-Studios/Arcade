# Publish the arcade: collect every studio game's newest web build and deploy
# the site to GitHub Pages. See README.md.
#
# Uses the studio GitHub App (the same one the studio template uses) to read
# the game repos, which may be private: variable TEMPLATE_APP_ID and secret
# TEMPLATE_APP_PRIVATE_KEY, both set on THIS repo.
name: Publish arcade

on:
  schedule:
    # Check for new game releases every 5 minutes (GitHub can delay scheduled
    # runs by a few minutes). A run with nothing new deploys nothing.
    # Minutes 3, 8, 13, … keep off the top of the hour, when GitHub is busiest
    # and most likely to drop scheduled runs.
    - cron: "3-58/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the studio GitHub App is set up
        env:
          APP_ID: ${{ vars.TEMPLATE_APP_CLIENT_ID || vars.TEMPLATE_APP_ID }}
          APP_KEY: ${{ secrets.TEMPLATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Set the variable TEMPLATE_APP_ID and the secret TEMPLATE_APP_PRIVATE_KEY on this repo (README.md, Setup)."
            exit 1
          fi

      - name: Mint a token from the studio GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_APP_CLIENT_ID || vars.TEMPLATE_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/configure-pages@v5
        id: pages

      - name: Anything new since the live site?
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LIVE: ${{ steps.pages.outputs.base_url }}
        run: |
          bash tools/collect.sh --state > want.txt
          curl -fsSL "${LIVE%/}/arcade-state.txt?t=$(date +%s)" -o live.txt 2>/dev/null || : > live.txt
          # Only the timer skips: a push (site change) or Run workflow always deploys.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && cmp -s want.txt live.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new game releases; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect game builds
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bash tools/collect.sh --out _site | tee collect.tsv
          {
            echo "### Arcade"
            echo
            echo "| | Repo | |"
            echo "|---|---|---|"
            awk -F'\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }' collect.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        if: steps.check.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
